# Build, test, and publish a runnable Windows (net472) API host artifact.
name: demo-app-ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - name: Restore
        run: dotnet restore DemoApp.sln

      - name: Compile
        run: dotnet build DemoApp.sln -c Release --no-restore

      - name: Unit + integration tests
        run: dotnet test DemoApp.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish API host (Demo App — net472, self-contained output folder)
        run: dotnet publish src/DemoApp.Legacy.ApiHost/DemoApp.Legacy.ApiHost.csproj -c Release --no-build -o "${{ github.workspace }}/artifacts/api-host"

      - name: Upload test report + published app
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            **/test-results.trx
            artifacts/api-host/
